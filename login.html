<!-- login.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/images/logo.png" type="image/png" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Login / Register - Rental Tracker</title>
    <link rel="stylesheet" href="mainpage.css" />
    <style>
      .auth-container {
        max-width: 400px;
        margin: 100px auto;
        background: var(--bg-secondary);
        padding: 30px;
        border-radius: 24px;
        border: 1px solid var(--border);
        box-shadow: var(--shadow-md);
      }
      .auth-container h2 {
        margin-bottom: 20px;
        color: var(--text-primary);
      }
      .auth-container label {
        display: block;
        text-align: left;
        color: var(--text-secondary);
        font-size: 0.9rem;
        margin-bottom: 4px;
        margin-top: 12px;
      }
      .auth-container input {
        width: 100%;
        margin-bottom: 15px;
        padding: 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--bg-tertiary);
        color: var(--text-primary);
      }
      .auth-container button {
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        border: none;
        background: var(--gradient-primary);
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: 0.15s;
      }
      .auth-container button:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-glow);
      }
      .toggle-link {
        text-align: center;
        margin-top: 20px;
        color: var(--accent-cyan);
        cursor: pointer;
      }
      .toggle-link:hover {
        text-decoration: underline;
      }
      .error-message {
        color: var(--danger);
        font-size: 0.8rem;
        margin-top: -10px;
        margin-bottom: 10px;
      }
      .email-check-message {
        font-size: 0.75rem;
        min-height: 16px;
        margin-top: -10px;
        margin-bottom: 6px;
      }
    </style>
  </head>
  <body>
    <div class="auth-container">
      <!-- Login Form -->
      <div id="login-form">
        <h2>Login</h2>
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" />
        <label for="login-password">Password</label>
        <input
          type="password"
          id="login-password"
          placeholder="Your password"
        />
        <div id="login-error" class="error-message"></div>
        <button id="login-btn">Login</button>
        <div class="toggle-link" id="show-register">
          Don't have an account? Register
        </div>
        <div
          class="toggle-link"
          id="forgot-password-link"
          style="margin-top: 10px"
        >
          Forgot password?
        </div>
      </div>

      <!-- Register Form (hidden initially) -->
      <div id="register-form" style="display: none">
        <h2>Register</h2>
        <label for="reg-name">Full Name</label>
        <input type="text" id="reg-name" placeholder="John Doe" />
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" placeholder="you@example.com" />
        <div id="email-check-message" class="email-check-message"></div>
        <label for="reg-password">Password</label>
        <input
          type="password"
          id="reg-password"
          placeholder="Min 6 characters"
        />
        <div id="register-error" class="error-message"></div>
        <button id="register-btn">Register</button>
        <div class="toggle-link" id="show-login">
          Already have an account? Login
        </div>
      </div>
    </div>

    <script>
      // ---- Toggle between forms (clear fields on switch) ----
      document.getElementById("show-register").addEventListener("click", () => {
        document.getElementById("login-form").style.display = "none";
        document.getElementById("register-form").style.display = "block";
        document.getElementById("login-email").value = "";
        document.getElementById("login-password").value = "";
        document.getElementById("login-error").textContent = "";
      });
      document.getElementById("show-login").addEventListener("click", () => {
        document.getElementById("register-form").style.display = "none";
        document.getElementById("login-form").style.display = "block";
        document.getElementById("reg-name").value = "";
        document.getElementById("reg-email").value = "";
        document.getElementById("reg-password").value = "";
        document.getElementById("register-error").textContent = "";
        document.getElementById("email-check-message").textContent = "";
      });

      // ---- Live email check ----
      let emailCheckTimeout;
      document.getElementById("reg-email").addEventListener("input", () => {
        clearTimeout(emailCheckTimeout);
        const email = document.getElementById("reg-email").value.trim();
        const msgDiv = document.getElementById("email-check-message");
        if (!email) {
          msgDiv.textContent = "";
          return;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          msgDiv.textContent = "Invalid email format";
          msgDiv.style.color = "#ef4444";
          return;
        }
        emailCheckTimeout = setTimeout(async () => {
          try {
            const res = await fetch(
              `/auth/check-email?email=${encodeURIComponent(email)}`
            );
            const data = await res.json();
            if (data.exists) {
              msgDiv.textContent = "Email already registered";
              msgDiv.style.color = "#ef4444";
            } else {
              msgDiv.textContent = "Email available";
              msgDiv.style.color = "#10b981";
            }
          } catch (err) {
            msgDiv.textContent = "";
          }
        }, 500);
      });

      // ---- REGISTER ----
      document
        .getElementById("register-btn")
        .addEventListener("click", async () => {
          const name = document.getElementById("reg-name").value.trim();
          const email = document.getElementById("reg-email").value.trim();
          const password = document.getElementById("reg-password").value;
          const errorDiv = document.getElementById("register-error");
          errorDiv.textContent = "";

          if (!name) {
            errorDiv.textContent = "Name is required.";
            return;
          }
          if (!email || !password) {
            errorDiv.textContent = "Email and password are required";
            return;
          }
          if (password.length < 6) {
            errorDiv.textContent = "Password must be at least 6 characters.";
            return;
          }

          try {
            const res = await fetch("/auth/register", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ name, email, password }),
            });
            const data = await res.json();
            if (res.ok) {
              Swal.fire({
                icon: "success",
                title: "Account Created",
                text: "Please login to continue.",
                timer: 2000,
                showConfirmButton: false,
                background: "#1e293b",
                color: "#f1f5f9",
                iconColor: "#10b981",
              });
              document.getElementById("register-form").style.display = "none";
              document.getElementById("login-form").style.display = "block";
              document.getElementById("reg-name").value = "";
              document.getElementById("reg-email").value = "";
              document.getElementById("reg-password").value = "";
              document.getElementById("email-check-message").textContent = "";
            } else {
              errorDiv.textContent = data.message || "Registration failed";
            }
          } catch (err) {
            errorDiv.textContent = "Network error";
          }
        });

      // ---- LOGIN ----
      document
        .getElementById("login-btn")
        .addEventListener("click", async () => {
          const email = document.getElementById("login-email").value.trim();
          const password = document.getElementById("login-password").value;
          const errorDiv = document.getElementById("login-error");
          errorDiv.textContent = "";

          if (!email || !password) {
            errorDiv.textContent = "Email and password are required";
            return;
          }

          try {
            const res = await fetch("/auth/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, password }),
            });
            const data = await res.json();
            if (res.ok) {
              localStorage.setItem("token", data.token);
              fetch("/tenants", {
                headers: { Authorization: `Bearer ${data.token}` },
              })
                .then((r) => r.ok && r.json())
                .then((tenants) => {
                  if (tenants)
                    sessionStorage.setItem(
                      "prefetchedTenants",
                      JSON.stringify(tenants)
                    );
                })
                .catch(() => {});
              Swal.fire({
                icon: "success",
                title: "Welcome back!",
                text: "Loading your dashboard...",
                timer: 1500,
                showConfirmButton: false,
                background: "#1e293b",
                color: "#f1f5f9",
                iconColor: "#10b981",
              }).then(() => {
                window.location.replace("mainPage.html");
              });
            } else {
              errorDiv.textContent = data.message || "Login failed";
            }
          } catch (err) {
            errorDiv.textContent = "Network error";
          }
        });

      // ---- FORGOT PASSWORD (revised – stays open while loading) ----
      document
        .getElementById("forgot-password-link")
        .addEventListener("click", async () => {
          const currentEmail = document
            .getElementById("login-email")
            .value.trim();

          // Step 1 – ask for email, stay open, show loader on confirm
          const { isConfirmed } = await Swal.fire({
            title: "Reset Password",
            text: "Enter your registered email address.",
            input: "email",
            inputValue: currentEmail,
            inputPlaceholder: "you@example.com",
            showCancelButton: true,
            confirmButtonText: "Send Reset Link",
            confirmButtonColor: "#3b82f6",
            background: "#1e293b",
            color: "#f1f5f9",
            showLoaderOnConfirm: true,
            allowOutsideClick: () => !Swal.isLoading(),
            preConfirm: async (email) => {
              if (!email) {
                Swal.showValidationMessage("Please enter your email.");
                return false;
              }

              // 🔁 Improved fetch with timeout and safe JSON handling
              const controller = new AbortController();
              const timeoutId = setTimeout(() => controller.abort(), 15000); // 15‑second timeout

              try {
                const res = await fetch("/auth/forgot-password", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ email }),
                  signal: controller.signal,
                });
                clearTimeout(timeoutId);

                // Safely parse JSON
                let data;
                try {
                  data = await res.json();
                } catch (jsonError) {
                  throw new Error("Server returned an invalid response.");
                }

                if (!res.ok) {
                  throw new Error(
                    data.message || "Could not send reset email."
                  );
                }
                return data; // passed to the next .then()
              } catch (err) {
                clearTimeout(timeoutId);
                if (err.name === "AbortError") {
                  Swal.showValidationMessage(
                    "Request timed out. Please try again."
                  );
                } else {
                  Swal.showValidationMessage(err.message);
                }
                return false;
              }
            },
          });

          // Step 2 – show result (the email popup is still open as a loader)
          if (isConfirmed) {
            Swal.fire({
              icon: "success",
              title: "Check your email",
              text: "If that email is registered, a reset link has been sent.",
              confirmButtonColor: "#3b82f6",
              background: "#1e293b",
              color: "#f1f5f9",
            });
          }
          // If validation or network error happened, Swal already shows the error message
        });
    </script>
    <script>
      (function () {
        const token = localStorage.getItem("token");
        if (token) window.location.replace("mainPage.html");
      })();
    </script>
  </body>
</html>
