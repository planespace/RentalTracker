<!-- login.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/images/logo.png" type="image/png" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Login / Register - Rental Tracker</title>
    <link rel="stylesheet" href="mainpage.css" />
    <style>
      /* Additional auth-specific styles */
      .auth-container {
        max-width: 400px;
        margin: 100px auto;
        background: var(--bg-secondary);
        padding: 30px;
        border-radius: 24px;
        border: 1px solid var(--border);
        box-shadow: var(--shadow-md);
      }
      .auth-container h2 {
        margin-bottom: 20px;
        color: var(--text-primary);
      }
      .auth-container input {
        width: 100%;
        margin-bottom: 15px;
        padding: 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--bg-tertiary);
        color: var(--text-primary);
      }
      .auth-container button {
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        border: none;
        background: var(--gradient-primary);
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: 0.15s;
      }
      .auth-container button:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-glow);
      }
      .toggle-link {
        text-align: center;
        margin-top: 20px;
        color: var(--accent-cyan);
        cursor: pointer;
      }
      .toggle-link:hover {
        text-decoration: underline;
      }
      .error-message {
        color: var(--danger);
        font-size: 0.8rem;
        margin-top: -10px;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div class="auth-container">
      <!-- Login Form -->
      <div id="login-form">
        <h2>Login</h2>
        <input type="email" id="login-email" placeholder="Email" />
        <input type="password" id="login-password" placeholder="Password" />
        <div id="login-error" class="error-message"></div>
        <button id="login-btn">Login</button>
        <div class="toggle-link" id="show-register">
          Don't have an account? Register
        </div>
        <div
          class="toggle-link"
          id="forgot-password-link"
          style="margin-top: 10px"
        >
          Forgot password?
        </div>
      </div>

      <!-- Register Form (hidden initially) -->
      <div id="register-form" style="display: none">
        <h2>Register</h2>
        <input type="text" id="reg-name" placeholder="Name" />
        <input type="email" id="reg-email" placeholder="Email" />
        <input type="password" id="reg-password" placeholder="Password" />
        <div id="register-error" class="error-message"></div>
        <button id="register-btn">Register</button>
        <div class="toggle-link" id="show-login">
          Already have an account? Login
        </div>
      </div>
    </div>

    <script>
      // Toggle between forms (existing)
      document.getElementById("show-register").addEventListener("click", () => {
        document.getElementById("login-form").style.display = "none";
        document.getElementById("register-form").style.display = "block";
      });
      document.getElementById("show-login").addEventListener("click", () => {
        document.getElementById("register-form").style.display = "none";
        document.getElementById("login-form").style.display = "block";
      });

      // Register (existing)
      document
        .getElementById("register-btn")
        .addEventListener("click", async () => {
          // … keep your existing register code …
        });

      // Login (existing)
      document
        .getElementById("login-btn")
        .addEventListener("click", async () => {
          // … keep your existing login code …
        });

      // ---------- NEW: Forgot Password handler ----------
      document
        .getElementById("forgot-password-link")
        .addEventListener("click", async () => {
          const { value: email } = await Swal.fire({
            title: "Reset Password",
            text: "Enter your registered email address.",
            input: "email",
            inputPlaceholder: "you@example.com",
            showCancelButton: true,
            confirmButtonText: "Send Reset Link",
            confirmButtonColor: "#3b82f6",
            background: "#1e293b",
            color: "#f1f5f9",
            inputValidator: (value) => {
              if (!value) return "Please enter your email.";
            },
          });

          if (!email) return;

          try {
            const res = await fetch("/auth/forgot-password", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email }),
            });
            const data = await res.json();
            Swal.fire({
              icon: "success",
              title: "Check your email",
              text:
                data.message ||
                "If that email is registered, a reset link has been sent.",
              confirmButtonColor: "#3b82f6",
              background: "#1e293b",
              color: "#f1f5f9",
            });
          } catch (err) {
            Swal.fire({
              icon: "error",
              title: "Error",
              text: "Could not send reset email. Please try again.",
              background: "#1e293b",
              color: "#f1f5f9",
            });
          }
        });
    </script>
    <script>
      (function () {
        const token = localStorage.getItem("token");
        if (token) {
          window.location.replace("mainPage.html");
        }
      })();
    </script>
  </body>
</html>
